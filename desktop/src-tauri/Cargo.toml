[package]
name = "tool-news"
version = "1.0.0"
description = "Tool News — dựng bản tin dọc từ text và ảnh/video trong máy"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
# Vỏ app không cần nhanh, cần nhẹ — bản cài mỏng đi vài MB.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
